[pytest]
# Pytest configuration for security tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage
[coverage:run]
source = backend
omit = 
    */tests/*
    */alembic/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

